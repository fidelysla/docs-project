markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:        # ← Activa el resaltado mejorado
      anchor_linenums: true    #   Permite enlazar líneas específicas
      line_spans: __span       #   Necesario para resaltar líneas
      pygments_lang_class: true
  - pymdownx.inlinehilite      # ← Resaltado en código inline `como este`
  - pymdownx.tasklist:
      custom_checkbox: true
  - md_in_html

extra_css:
  # - assets/katex/katex.min.css

extra_javascript:
  - assets/mathjax/mathjax-init.js
  - assets/mathjax/tex-mml-chtml.js
