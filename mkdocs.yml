site_name: Mi Notas de Estudio
site_description: Un sitio para organizar mis notas de estudio.

theme:
  name: material
  language: es
  features:
    - content.math
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Modo oscuro

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Modo claro

nav:
  - Inicio: index.md
  - Fundamentos de Estadistica:
      - Estadistica y Probabilidad: fundamentos-estadistica-probabilidad.md
      - Estadistica Multivariada: estadistica-multivariada-y-probabilidad.md

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
