site_name: Mi Notas de Estudio
site_description: Un sitio para organizar mis notas de estudio.

theme:
  name: material
  language: es
  features:
    - content.math
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Modo oscuro

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Modo claro

nav:
  - Inicio: index.md
  - Multimedia: multimedia/index.md
  - Fundamentos de Estadística:
      - Introducción: estadistica/index.md
      - Estadística y Probabilidad: estadistica/fundamentos-estadistica-probabilidad.md
      - Estadística Multivariada: estadistica/estadistica-multivariada-y-probabilidad.md
      - Técnicas de Conteo: estadistica/tecnicas-de-conteo-y-probabilidad.md
      - Practica de Probabilidad: estadistica/probabilidad-condicional-y-practica.md
      - Probabilidad Condicional Independiencia y Teorema de Bayes: estadistica/probabilidad-condicional-bayes-variables-aleatorias.md
      - Variables Aleatorias Discretas y Distribuciones de Probabilidad: estadistica/variables-aleatorias-discretas.md
      - Ejercicios de Repaso: estadistica/ejercicios-distribucion-binomial-y-esperanza.md
  - Estadística Aplicada:
      - Temas: estadistica-aplicada/index.md
      - Principales Distribuciones Continuas: estadistica-aplicada/distribuciones-continuas.md
      - Métodos de Muestreo Probabilístico: estadistica-aplicada/introduccion-muestreo.md
      - Distribuciones Muestrales: estadistica-aplicada/distribuciones-muestrales.md
      - Resumen Teorico: estadistica-aplicada/resumen-teorico-est.md
      - Estimación de Parámetros: estadistica-aplicada/estimacion-parametros.md
      - Prueba de Hipotesis: estadistica-aplicada/prueba-hipotesis.md
  - Matematica Financiera:
      - Temas: mate-financiera/index.md
      - Conceptos Basicos: mate-financiera/conceptos-basicos.md
      - Interés Simple: mate-financiera/interes-simple.md
      - Ecuaciones de Valor y Descuento Simple: mate-financiera/ecuaciones-valor-descuento-simple.md
      - Examen 1: mate-financiera/examen-teorico-1.md
      - Interés Compuesto: mate-financiera/interes-compuesto.md
  - Economia:
      - Temas: economia/index.md
      - Los 12 Principios de la Economía: economia/principios.md
      - Resumen Teórico: economia/resumen-teorico.md
      - U2 Calculo de Indicadores Macro PBI: economia/u2-indicadores-macro-pbi.md
  - Derecho Empresarial:
      - Temas: derecho-emp/index.md
      - LGS y Sociedades: derecho-emp/lgs-sociedades.md
      - Reorganizacion y Transformación: derecho-emp/reorganizacion.md
      - Ejemplo PC2: derecho-emp/ejm-exam-pc2.md

